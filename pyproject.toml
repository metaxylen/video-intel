[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "yt-captions-md"
version = "0.1.0"
description = "CLI to save YouTube captions as Markdown files (no API key)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "youtube-transcript-api>=0.6.2",
    "yt-dlp[default,curl-cffi]>=2026.10.26",
]

[project.scripts]
yt-captions-md = "youtube_transcript.cli:main"
video-intel = "video_intel.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]
asr = ["mlx-whisper; sys_platform == 'darwin' and platform_machine == 'arm64'"]

[tool.setuptools.packages.find]
include = ["youtube_transcript*", "video_intel*"]

[tool.setuptools.package-data]
video_intel = ["schema/*.json"]
